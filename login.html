<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Embodi AI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="nav scrolled">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="brand-text"><span class="dot"></span>EMBODI<span style="color:var(--text-3)">.AI</span></span><img class="logo-img" alt="Embodi AI logo"></a>
    <div class="nav-links"><a href="index.html#products">Products</a><a href="index.html#pricing">Pricing</a><a href="index.html#faq">FAQ</a></div>
    <div class="nav-cta"><a href="register.html" class="btn btn-primary btn-sm">Start Free Trial</a></div>
  </div>
</nav>
<div class="auth-wrap">
  <div class="auth-card">
    <span class="mono-tag">welcome back</span>
    <h1>Log in to Embodi AI</h1>
    <p class="sub">Access your fleet dashboard and deployment settings.</p>
    <form id="login-form" novalidate>
      <div class="field"><label for="email">Work email</label><input id="email" type="email" required placeholder="you@company.com"></div>
      <div class="field"><label for="password">Password</label><input id="password" type="password" required placeholder="••••••••"></div>
      <button type="submit" class="btn btn-primary" style="width:100%">Log in</button>
      <div class="form-msg" id="login-msg"></div>
    </form>
    <div class="auth-foot">Don't have an account? <a href="register.html">Start a free trial</a></div>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
