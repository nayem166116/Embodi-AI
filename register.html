<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Start free trial — Embodi AI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<nav class="nav scrolled">
  <div class="wrap">
    <a href="index.html" class="brand"><span class="brand-text"><span class="dot"></span>EMBODI<span style="color:var(--text-3)">.AI</span></span><img class="logo-img" alt="Embodi AI logo"></a>
    <div class="nav-links"><a href="index.html#products">Products</a><a href="index.html#pricing">Pricing</a><a href="index.html#faq">FAQ</a></div>
    <div class="nav-cta"><a href="login.html" class="btn btn-ghost btn-sm">Log in</a></div>
  </div>
</nav>
<div class="auth-wrap">
  <div class="auth-card">
    <span class="mono-tag">// request access</span>
    <h1>Start your free trial</h1>
    <p class="sub">Deploy on one cell, no hardware changes required.</p>
    <form id="register-form" novalidate>
      <div class="field"><label for="name">Full name</label><input id="name" type="text" required placeholder="Jordan Lee"></div>
      <div class="field"><label for="email2">Work email</label><input id="email2" type="email" required placeholder="you@company.com"></div>
      <div class="field"><label for="company">Company</label><input id="company" type="text" required placeholder="Company name"></div>
      <div class="field"><label for="password2">Password</label><input id="password2" type="password" required placeholder="••••••••"></div>
      <button type="submit" class="btn btn-primary" style="width:100%">Create account</button>
      <div class="form-msg" id="register-msg"></div>
    </form>
    <div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<div class="modal-overlay" id="verify-modal">
  <div class="modal-card">
    <button class="modal-close" id="verify-close">×</button>
    <span class="mono-tag">verify email</span>
    <h2>Enter your verification code</h2>
    <p class="sub" id="verify-copy">We sent a 6-digit code to your email.</p>
    <div class="field">
      <label for="verify-code">Verification code</label>
      <input id="verify-code" type="text" inputmode="numeric" maxlength="6" placeholder="000000">
      <div class="field-error" id="verify-error"></div>
    </div>
    <button id="verify-submit" class="btn btn-primary" style="width:100%">Verify &amp; create account</button>
    <div class="auth-foot"><a href="#" id="verify-resend">Resend code</a></div>
  </div>
</div>

<script src="js/main.js"></script>
</body>
</html>
